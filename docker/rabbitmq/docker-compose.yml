version: '3.8'  # or the version you're using

services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      - RABBITMQ_NODE_IP_ADDRESS=0.0.0.0
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"  # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - your_network  # Make sure the network is defined elsewhere in the file if needed

volumes:
  rabbitmq_data:

networks:
  your_network:
    driver: bridge
