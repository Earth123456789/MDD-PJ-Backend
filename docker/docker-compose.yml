version: '3.8'

networks:
  traefik:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
  rabbitmq_data:

services:
  # Matching
  matching-service:
    build:
      context: ../services/matching
      dockerfile: Dockerfile
    container_name: matching-service
    restart: always
    ports:
      - "3002:3002" 
    depends_on:
      - postgres
      - rabbitmq
      - elasticsearch
    env_file:
      - ../services/matching/.env
    volumes:
      - ../services/matching:/app
      - /app/node_modules
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.matching.entrypoints=web"
      - "traefik.http.routers.matching.rule=Host(`matching.localhost`)"
      - "traefik.http.services.matching.loadbalancer.server.port=3002"
    command: >
      bash -c "
        sleep 15 &&
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run start:dev
      "
    # User
  user-driver-service:
    build:
      context: ../services/user-driver
      dockerfile: Dockerfile 
    container_name: user-driver
    restart: always
    ports:
      - "3001:3001" 
    depends_on:
      - rabbitmq
      - elasticsearch 
    env_file:
      - ../services/user-driver/.env
    volumes:
      - ../services/user-driver:/app
      - /app/node_modules
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.user-driver.entrypoints=web"
      - "traefik.http.routers.user-driver.rule=Host(`user-driver.localhost`)"
      - "traefik.http.services.user-driver.loadbalancer.server.port=3001"
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run start
      "
  
  # tracking-notification
  # tracking-notification-service:
  #   build:
  #     context: ../services/tracking-notification
  #     dockerfile: Dockerfile 
  #   container_name: tracking-notification
  #   restart: always
  #   ports:
  #     - "3004:3004" 
  #   depends_on:
  #     - rabbitmq
  #     - elasticsearch 
  #   env_file:
  #     - ../services/tracking-notification/.env
  #   volumes:
  #     - ../services/tracking-notification:/app
  #     - /app/node_modules
  #   networks:
  #     - traefik
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.docker.network=traefik"
  #     - "traefik.http.routers.tracking-notification.entrypoints=web"
  #     - "traefik.http.routers.tracking-notification.rule=Host(`tracking-notification.localhost`)"
  #     - "traefik.http.services.tracking-notification.loadbalancer.server.port=3004"
  #   command: >
  #     sh -c "
  #       npx prisma generate &&
  #       npx prisma migrate deploy &&
  #       npm run start
  #     "
  
  # Payment
  payment-service:
    build:
      context: ../services/payment
      dockerfile: Dockerfile
    container_name: payment-service
    restart: always
    ports:
      - "3003:3003" 
    depends_on:
      - postgres
      - rabbitmq
      - elasticsearch
      - redis
    env_file:
      - ../services/payment/.env
    volumes:
      - ../services/payment:/app
      - /app/node_modules
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.payment.entrypoints=web"
      - "traefik.http.routers.payment.rule=Host(`payment.localhost`)"
      - "traefik.http.services.payment.loadbalancer.server.port=3003"
    command: >
      bash -c "
        sleep 15 &&
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run start:dev
      "

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis.entrypoints=web"
      - "traefik.http.routers.redis.rule=Host(`redis.localhost`)"
      - "traefik.http.services.redis.loadbalancer.server.port=6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    
  # PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=matching
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postgres.entrypoints=web"
      - "traefik.http.routers.postgres.rule=Host(`postgres.localhost`)"
      - "traefik.http.services.postgres.loadbalancer.server.port=5432"

  # PgAdmin - PostgreSQL UI (When Deploy in Cloud)
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.localhost`)"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  # RabbitMQ Queue System
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: elasticsearch
    restart: always
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - traefik

  # Traefik - Load Balancer
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "8080:8080"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock 